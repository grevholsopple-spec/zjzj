<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>构件图纸</title>
<link rel="stylesheet" href="style.css?v=4">
<style>
  html, body { height: 100%; overflow: hidden; }
  body { display: flex; flex-direction: column; background: #1f232a; }
  #cad { flex: 1; position: relative; touch-action: none; overflow: hidden; }
  #cad canvas { display: block; }
  .tools { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 8px; z-index: 5; }
  .tools button, .tools a {
    border: 0; background: rgba(255,255,255,.92); color: #1aad19; font-size: 13px; font-weight: 600;
    padding: 8px 10px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.3); text-decoration: none; text-align: center;
  }
  .hint { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; font-size: 12px; color: #9aa3ad; pointer-events: none; }
  .loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #c9d1d9; font-size: 14px; z-index: 4; }
  .layers {
    position: absolute; right: 10px; top: 150px; z-index: 6; background: rgba(255,255,255,.96); border-radius: 10px;
    padding: 6px 12px; box-shadow: 0 2px 10px rgba(0,0,0,.35); display: none; font-size: 14px; color: #333;
  }
  .layers label { display: flex; align-items: center; gap: 8px; padding: 6px 0; }
  .layers i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; border: 1px solid #999; }
</style>
</head>
<body>
<div class="bar"><a href="index.html">‹ 返回</a><div class="t" id="t">构件图纸</div><a id="dl" href="#" download>下载CAD</a></div>
<div id="cad">
  <div class="loading" id="loading">CAD 图纸加载中…</div>
  <div class="tools">
    <button id="b-fit">全图</button>
    <button id="b-layer">图层</button>
    <a href="drawing-img.html">图片版</a>
  </div>
  <div class="layers" id="layers"></div>
  <div class="hint">双指缩放 · 单指拖动 · 点“全图”复位</div>
</div>

<script src="common.js?v=4"></script>
<script src="lib/cad.js?v=4"></script>
<script>
ZJ.loadData().then(function (d) {
  document.getElementById('t').textContent = (d['构件编号'] || '') + ' 构件详图';
  document.title = (d['构件编号'] || '') + ' 构件详图';
  var ext = d['外部文件'] || {};
  var dxf = ext['图纸DXF'];
  if (!dxf) { location.replace('drawing-img.html'); return; }
  var dl = document.getElementById('dl');
  dl.href = dxf;
  var loading = document.getElementById('loading');
  return window.startCad(document.getElementById('cad'), dxf + '?t=' + Date.now(), 'lib/zjfont.ttf', function (phase) {
    loading.textContent = { font: '加载字体…', fetch: '下载图纸…', parse: '解析图纸…', prepare: '生成图形…' }[phase] || 'CAD 图纸加载中…';
  }).then(function (cad) {
    loading.style.display = 'none';
    document.getElementById('b-fit').onclick = cad.fit;
    var box = document.getElementById('layers');
    box.innerHTML = cad.layers().map(function (l) {
      var c = '#' + ('000000' + (l.color >>> 0).toString(16)).slice(-6);
      return '<label><input type="checkbox" checked data-n="' + ZJ.esc(l.name) + '"><i style="background:' + c + '"></i>' + ZJ.esc(l.name) + '</label>';
    }).join('');
    box.onchange = function (e) { cad.showLayer(e.target.getAttribute('data-n'), e.target.checked); };
    document.getElementById('b-layer').onclick = function () { box.style.display = box.style.display === 'block' ? 'none' : 'block'; };
  });
}).catch(function (e) {
  // 极少数手机不支持 WebGL 时，自动换成图片版
  console.error(e);
  location.replace('drawing-img.html');
});
</script>
</body>
</html>
